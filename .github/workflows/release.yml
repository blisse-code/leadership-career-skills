name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py && python scripts/build.py
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/claude/*.skill
            dist/chatgpt/*.zip
            dist/custom-gpts-fallback.zip
            dist/leadership-career-skills-all.zip
